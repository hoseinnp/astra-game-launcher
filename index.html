<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASTRA - Game Launcher & Library</title>
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('astra_settings') || localStorage.getItem('nexus_settings');
          var settings = raw ? JSON.parse(raw) : {};
          var accent = localStorage.getItem('customAccent') || settings.customAccent;
          var intensityStr = localStorage.getItem('glowIntensity') !== null ? localStorage.getItem('glowIntensity') : (settings.glowIntensity !== undefined ? settings.glowIntensity : 70);
          var intensity = Math.max(0, Math.min(100, Number(intensityStr)));
          var reduce = settings.reduceEffects || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

          if (reduce) {
            document.documentElement.classList.add('reduce-effects');
          }

          if (accent && /^#[0-9a-fA-F]{6}$/.test(accent)) {
            var r = parseInt(accent.slice(1, 3), 16);
            var g = parseInt(accent.slice(3, 5), 16);
            var b = parseInt(accent.slice(5, 7), 16);
            var yiq = (r * 299 + g * 587 + b * 114) / 1000;
            var contrast = yiq >= 128 ? '#000000' : '#ffffff';
            var spread = Math.round(20 * (intensity / 100));
            var alpha = (0.35 * (intensity / 100)).toFixed(2);
            document.documentElement.style.setProperty('--accent', accent);
            document.documentElement.style.setProperty('--accent-rgb', r + ', ' + g + ', ' + b);
            document.documentElement.style.setProperty('--accent-contrast', contrast);
            document.documentElement.style.setProperty('--glow-intensity', (intensity / 100).toFixed(2));
            if (intensity === 0 || reduce) {
              document.documentElement.style.setProperty('--accent-glow', 'none');
            } else {
              document.documentElement.style.setProperty('--accent-glow', '0 0 ' + spread + 'px rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
